<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}tanyaUMRAH Admin{% endblock %}</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#1565C0',
                        secondary: '#0D47A1',
                        accent: '#FBC02D',
                    }
                }
            }
        }
    </script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-gray-50 text-gray-800 flex h-screen overflow-hidden">

    <!-- Sidebar -->
    <aside class="w-64 bg-slate-900 text-white flex flex-col justify-between">
        <div>
            <!-- Header/Logo -->
            <div class="p-6 border-b border-slate-800 flex items-center space-x-3">
                <div class="w-10 h-10 rounded-xl bg-primary flex items-center justify-center font-bold text-white text-xl shadow-lg">
                    tU
                </div>
                <div>
                    <h1 class="font-bold text-lg leading-none">tanyaUMRAH</h1>
                    <span class="text-xs text-blue-400">Admin Knowledge Base</span>
                </div>
            </div>

            <!-- Navigation Links -->
            <nav class="p-4 space-y-1.5 text-sm font-medium">
                <a href="/admin" class="flex items-center space-x-3 px-4 py-3 rounded-lg hover:bg-slate-800 transition {% if active_page == 'dashboard' %}bg-primary text-white{% else %}text-slate-300{% endif %}">
                    <i data-lucide="layout-dashboard" class="w-5 h-5"></i>
                    <span>Dashboard</span>
                </a>
                <a href="/admin/documents" class="flex items-center space-x-3 px-4 py-3 rounded-lg hover:bg-slate-800 transition {% if active_page == 'documents' %}bg-primary text-white{% else %}text-slate-300{% endif %}">
                    <i data-lucide="file-text" class="w-5 h-5"></i>
                    <span>Dokumen Knowledge</span>
                </a>
                <a href="/admin/calendar" class="flex items-center space-x-3 px-4 py-3 rounded-lg hover:bg-slate-800 transition {% if active_page == 'calendar' %}bg-primary text-white{% else %}text-slate-300{% endif %}">
                    <i data-lucide="calendar" class="w-5 h-5"></i>
                    <span>Kalender Akademik</span>
                </a>
                <a href="/admin/students" class="flex items-center space-x-3 px-4 py-3 rounded-lg hover:bg-slate-800 transition {% if active_page == 'students' %}bg-primary text-white{% else %}text-slate-300{% endif %}">
                    <i data-lucide="users" class="w-5 h-5"></i>
                    <span>Data Mahasiswa</span>
                </a>
            </nav>
        </div>

        <!-- Footer / Environment info -->
        <div class="p-4 border-t border-slate-800 text-xs text-slate-400">
            <div class="flex items-center space-x-2 mb-1">
                <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
                <span>Mode: <strong class="text-emerald-400">Local Dev</strong></span>
            </div>
            <p>DB: SQLite | Vector: ChromaDB</p>
        </div>
    </aside>

    <!-- Main Content Area -->
    <div class="flex-1 flex flex-col overflow-hidden">
        <!-- Top Navbar -->
        <header class="bg-white border-b border-gray-200 px-8 py-4 flex items-center justify-between shadow-sm">
            <h2 class="text-xl font-bold text-gray-800">{% block header_title %}Dashboard{% endblock %}</h2>
            <div class="flex items-center space-x-4">
                <a href="/docs" target="_blank" class="text-xs bg-slate-100 hover:bg-slate-200 text-slate-700 px-3 py-1.5 rounded-md font-medium transition flex items-center space-x-1">
                    <i data-lucide="code" class="w-3.5 h-3.5"></i>
                    <span>Swagger API Docs</span>
                </a>
                <div class="flex items-center space-x-2 text-sm text-gray-600 font-medium">
                    <div class="w-8 h-8 rounded-full bg-primary/10 text-primary flex items-center justify-center font-bold">
                        A
                    </div>
                    <span>Administrator</span>
                </div>
            </div>
        </header>

        <!-- Dynamic Body -->
        <main class="flex-1 overflow-y-auto p-8">
            {% block content %}{% endblock %}
        </main>
    </div>

    <script>
        lucide.createIcons();
    </script>
</body>
</html>
